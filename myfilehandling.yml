---
- hosts: 172.31.30.252
  become: yes
  tasks:
  - include_tasks: myfile.yml
  - name: install apache2 webserver
    apt:
      name: apache2
      state: present
  - name: create a folder
    file:
      path: /home/maha/myfolder
      state: directory
  - name: copy static file 
    copy:
      src: mystaticfile
      dest: /home/maha/myfolder/

