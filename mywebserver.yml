---
- hosts: all
  become: yes
  gather_facts: yes
  tasks: 
  - name: i want to install webserver on debian nodes( apt-get install apache2)
    apt:
      name: apache2 
      state: present
    when: ansible_os_family == "Debian"

  - name: i want to start webserver on debian nodes ( service apache2 start)
    service:
       name: apache2 
       state: started
    when: ansible_os_family == "Debian"

  - name: i want to install webserver on redhat nodes( yum install httpd)
    yum: 
      name: httpd
      state: present
    when: ansible_os_family == "RedHat"

  - name: i want to start webserver on redhat nodes ( service httpd start)
    service:
       name: httpd
       state: started
    when: ansible_os_family == "RedHat"
